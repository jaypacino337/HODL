[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Robinhood Chain is an Arbitrum Orbit L2. Until its public RPC ships, deploy
# and test against Arbitrum Sepolia — same stack, same tooling.
[rpc_endpoints]
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
# robinhood_chain = "<public RPC when available>"
