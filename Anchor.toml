[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pumpbroker_mint = "8MziWLhyk1oWYM6di5eMsS9JAxXxfLgjXBKHb8NCSCKf"
pumpbroker_buyback = "98ECcFgwqei1mMnhvBjCxmqdZtA6GxVPF3iSKjWvwF4d"

[programs.devnet]
pumpbroker_mint = "8MziWLhyk1oWYM6di5eMsS9JAxXxfLgjXBKHb8NCSCKf"
pumpbroker_buyback = "98ECcFgwqei1mMnhvBjCxmqdZtA6GxVPF3iSKjWvwF4d"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# mpl-core is cloned into the local validator so the full lifecycle (create asset,
# transfer, update) runs against the real program rather than a stub.
[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
