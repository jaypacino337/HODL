[package]
name = "pumpbroker-mint"
version = "0.1.0"
description = "PumpBrokers PIECE 2 — public mint. Deployed and paused before launch; opened with one set_active(true)."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pumpbroker_mint"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
mpl-core = { workspace = true }
solana-program = { workspace = true }
